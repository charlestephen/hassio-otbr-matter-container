# Home Assistant Container + OpenThread Border Router + Matter Server.
# All three use host networking. ConBee II Thread RCP defaults.
#
# Wire-up in Home Assistant:
#   OTBR   http://127.0.0.1:8081
#   Matter ws://127.0.0.1:5580/ws
#
# Copy .env.example to .env, set DEVICE_HOST and BACKBONE_IF, then:
#   docker compose up -d

services:
  hassio:
    container_name: hassio
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ${HA_CONFIG:-./data/hassio}:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "1m"

  thread:
    container_name: thread
    # Also: docker.io/charlestephen/hassio-otbr-matter-container:latest
    image: ghcr.io/charlestephen/hassio-otbr-matter-container:latest
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      DEVICE: ${DEVICE:-/dev/ttyACM0}
      BACKBONE_IF: ${BACKBONE_IF:-eth0}
      BAUDRATE: ${BAUDRATE:-115200}
      FLOW_CONTROL: ${FLOW_CONTROL:-1}
      AUTOFLASH_FIRMWARE: "0"
      FIREWALL: ${FIREWALL:-1}
      NAT64: ${NAT64:-1}
      OTBR_REST_PORT: ${OTBR_REST_PORT:-8081}
      OTBR_WEB_PORT: ${OTBR_WEB_PORT:-8080}
      OTBR_WEB: ${OTBR_WEB:-1}
      OTBR_LOG_LEVEL: ${OTBR_LOG_LEVEL:-notice}
    devices:
      - ${DEVICE_HOST:-/dev/ttyACM0}:${DEVICE:-/dev/ttyACM0}
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${OTBR_DATA:-./data/thread}:/data/thread
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "1m"

  matter:
    container_name: matter
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    network_mode: host
    privileged: true
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${MATTER_DATA:-./data/matter}:/data
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - --storage-path
      - /data
      - --paa-root-cert-dir
      - /data/credentials
      - --bluetooth-adapter
      - ${MATTER_BT_ADAPTER:-0}
      - --log-level-sdk
      - progress
      - --primary-interface
      - ${BACKBONE_IF:-eth0}
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "1m"
